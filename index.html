<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>記帳水豚</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  
  <!-- 你的 PWA 設定 (manifest, icons 等等) -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc; /* 與您的 GAS 網頁背景同色 */
    }

    /* 關鍵在這裡！把 padding 加在最外層的容器 */
    .app-container {
      width: 100%;
      height: 100%;
      /* 使用系統安全距離，若無則預設往下推 44px */
      padding-top: max(env(safe-area-inset-top), 44px); 
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      flex-grow: 1; /* 讓 iframe 填滿剩餘空間 */
      border: none;
    }
  </style>
</head>
<body>
  
  <!-- 將 iframe 包在這個帶有 padding 的容器裡 -->
  <div class="app-container">
    <!-- 替換 src 為你實際的 Google Apps Script 網址 -->
    <iframe src="https://script.google.com/macros/s/AKfycbyvPu1hrlGzdwKd7nf9b2Aw1C3SAVkXeiTp-NVLXOIfMCWf2o1EefrRDDBuoxbV44TcKA/exec?p=2030house"></iframe>
  </div>

</body>
</html>
